name: Repair Custom Provider Persistence

on:
  push:
    branches:
      - fix-requesty-final-2

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Custom / Requesty persistence
        shell: python
        run: |
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Missing expected text in {path}: {old[:120]!r}')
                  s = s.replace(old, new, 1)
              if s == original:
                  raise SystemExit(f'No changes made to {path}')
              p.write_text(s, encoding='utf-8')

          # Small shared persistence helper. URL/auth type live in config.json;
          # the actual bearer/API-key secret continues to live in the keychain.
          helper = Path('src/lib/customLlmConfig.ts')
          helper.parent.mkdir(parents=True, exist_ok=True)
          helper.write_text('''import { load } from "@tauri-apps/plugin-store";\n\nexport type CustomAuthType = "none" | "bearer" | "api_key";\n\nexport interface CustomLlmConfig {\n  baseUrl: string;\n  authType: CustomAuthType;\n}\n\nconst STORE_FILE = "config.json";\n\nexport async function getCustomLlmConfig(): Promise<CustomLlmConfig> {\n  const store = await load(STORE_FILE, { autoSave: true, defaults: {} });\n  return {\n    baseUrl: (await store.get<string>("customLlmBaseUrl")) ?? "",\n    authType: ((await store.get<string>("customLlmAuthType")) as CustomAuthType | null) ?? "none",\n  };\n}\n\nexport async function saveCustomLlmConfig(config: CustomLlmConfig): Promise<void> {\n  const store = await load(STORE_FILE, { autoSave: true, defaults: {} });\n  await store.set("customLlmBaseUrl", config.baseUrl.trim().replace(/\\/+$/, ""));\n  await store.set("customLlmAuthType", config.authType);\n}\n''', encoding='utf-8')

          # Settings: restore Custom fields after restart and persist changes.
          edit('src/settings/LLMSettings.tsx', [
              (
                  'import type { LLMProviderType, ModelInfo, OpenRouterModel } from "../lib/types";\n',
                  'import type { LLMProviderType, ModelInfo, OpenRouterModel } from "../lib/types";\nimport { getCustomLlmConfig, saveCustomLlmConfig } from "../lib/customLlmConfig";\n'
              ),
              (
                  '  useEffect(() => {\n    const info = PROVIDER_DISPLAY[selectedProvider];\n',
                  '  useEffect(() => {\n    if (selectedProvider !== "custom") return;\n    let cancelled = false;\n    (async () => {\n      try {\n        const saved = await getCustomLlmConfig();\n        const savedKey = await getApiKey("custom").catch(() => null);\n        if (!cancelled) {\n          setCustomBaseUrl(saved.baseUrl);\n          setCustomAuthType(saved.authType);\n          setCustomAuthValue(savedKey || "");\n        }\n      } catch (e) {\n        console.warn("[LLMSettings] Failed to restore Custom config:", e);\n      }\n    })();\n    return () => { cancelled = true; };\n  }, [selectedProvider]);\n\n  useEffect(() => {\n    const info = PROVIDER_DISPLAY[selectedProvider];\n'
              ),
              (
                  '  const handleProviderChange = (provider: LLMProviderType) => {\n',
                  '  const persistCustomConfig = useCallback(async (baseUrl = customBaseUrl, authType = customAuthType, authValue = customAuthValue) => {\n    if (selectedProvider !== "custom") return;\n    try {\n      await saveCustomLlmConfig({ baseUrl, authType });\n      if (authType !== "none" && authValue) {\n        await storeApiKey("custom", authValue);\n      }\n    } catch (e) {\n      console.warn("[LLMSettings] Failed to persist Custom config:", e);\n    }\n  }, [selectedProvider, customBaseUrl, customAuthType, customAuthValue]);\n\n  const handleProviderChange = (provider: LLMProviderType) => {\n'
              ),
              (
                  '    setModelsError("");\n  };\n\n  const handleSaveApiKey = async () => {\n',
                  '    setModelsError("");\n    if (provider === "custom") {\n      getCustomLlmConfig().then((saved) => {\n        setCustomBaseUrl(saved.baseUrl);\n        setCustomAuthType(saved.authType);\n        return getApiKey("custom");\n      }).then((savedKey) => setCustomAuthValue(savedKey || "")).catch(() => {});\n    }\n  };\n\n  const handleSaveApiKey = async () => {\n'
              ),
              (
                  '      if (apiKey) await storeApiKey(selectedProvider, apiKey).catch(() => {});\n      const configJson = buildProviderConfig();\n',
                  '      if (selectedProvider === "custom") await persistCustomConfig();\n      if (apiKey) await storeApiKey(selectedProvider, apiKey).catch(() => {});\n      const configJson = buildProviderConfig();\n'
              ),
              (
                  '            <input\n              type="text"\n              value={customBaseUrl}\n              onChange={(e) => setCustomBaseUrl(e.target.value)}\n',
                  '            <input\n              type="text"\n              value={customBaseUrl}\n              onChange={(e) => setCustomBaseUrl(e.target.value)}\n              onBlur={() => persistCustomConfig()}\n'
              ),
              (
                  '                onChange={(e) => setCustomAuthType(e.target.value as "none" | "bearer" | "api_key")}\n',
                  '                onChange={(e) => {\n                  const value = e.target.value as "none" | "bearer" | "api_key";\n                  setCustomAuthType(value);\n                  persistCustomConfig(customBaseUrl, value, customAuthValue);\n                }}\n'
              ),
              (
                  '                  onChange={(e) => setCustomAuthValue(e.target.value)}\n',
                  '                  onChange={(e) => setCustomAuthValue(e.target.value)}\n                  onBlur={() => persistCustomConfig()}\n'
              ),
          ])

          # configStore startup sync: Custom needs base_url/auth_type, otherwise Rust falls back.
          edit('src/stores/configStore.ts', [
              (
                  '      const llmModel = await store.get<string>("llmModel");\n',
                  '      const llmModel = await store.get<string>("llmModel");\n      const customLlmBaseUrl = await store.get<string>("customLlmBaseUrl");\n      const customLlmAuthType = await store.get<string>("customLlmAuthType");\n'
              ),
              (
                  '            const apiKey = await ipcGetKey(loadedLLMProvider).catch(() => null);\n            const config = JSON.stringify({\n              provider_type: loadedLLMProvider,\n              ...(apiKey && { api_key: apiKey }),\n            });\n',
                  '            const apiKey = await ipcGetKey(loadedLLMProvider).catch(() => null);\n            const config = JSON.stringify({\n              provider_type: loadedLLMProvider,\n              ...(apiKey && { api_key: apiKey }),\n              ...(loadedLLMProvider === "custom" && customLlmBaseUrl && { base_url: customLlmBaseUrl }),\n              ...(loadedLLMProvider === "custom" && customLlmAuthType && customLlmAuthType !== "none" && {\n                auth_type: customLlmAuthType,\n                ...(apiKey && { auth_value: apiKey }),\n              }),\n            });\n'
              ),
          ])

          # ServiceStatusBar: use the persisted Custom config when listing/applying models.
          edit('src/components/ServiceStatusBar.tsx', [
              (
                  'import type { STTProviderType, LLMProviderType, LocalSTTEngineInfo } from "../lib/types";\n',
                  'import type { STTProviderType, LLMProviderType, LocalSTTEngineInfo } from "../lib/types";\nimport { getCustomLlmConfig } from "../lib/customLlmConfig";\n'
              ),
              (
                  '        const { listModels } = await import("../lib/ipc");\n        const key = await getApiKey(pendingProvider).catch(() => null);\n        const config = JSON.stringify({\n          provider_type: pendingProvider,\n          ...(key && { api_key: key }),\n        });\n',
                  '        const { listModels } = await import("../lib/ipc");\n        const key = await getApiKey(pendingProvider).catch(() => null);\n        const custom = pendingProvider === "custom" ? await getCustomLlmConfig() : null;\n        const config = JSON.stringify({\n          provider_type: pendingProvider,\n          ...(key && { api_key: key }),\n          ...(custom?.baseUrl && { base_url: custom.baseUrl }),\n          ...(custom && custom.authType !== "none" && {\n            auth_type: custom.authType,\n            ...(key && { auth_value: key }),\n          }),\n        });\n'
              ),
              (
                  '  // Only show verified/ready providers\n  const available = LLM_PROVIDER_OPTIONS.filter((o) => {\n    if (o.value === "custom") return false;\n',
                  '  // Only show verified/ready providers; Custom is available once configured or active.\n  const customConfigured = useConfigStore.getState().llmProvider === "custom";\n  const available = LLM_PROVIDER_OPTIONS.filter((o) => {\n    if (o.value === "custom") return customConfigured;\n'
              ),
              (
                  '                const key = await getApiKey(provider).catch(() => null);\n                const config = JSON.stringify({\n                  provider_type: provider,\n                  ...(key && { api_key: key }),\n                });\n',
                  '                const key = await getApiKey(provider).catch(() => null);\n                const custom = provider === "custom" ? await getCustomLlmConfig() : null;\n                const config = JSON.stringify({\n                  provider_type: provider,\n                  ...(key && { api_key: key }),\n                  ...(custom?.baseUrl && { base_url: custom.baseUrl }),\n                  ...(custom && custom.authType !== "none" && {\n                    auth_type: custom.authType,\n                    ...(key && { auth_value: key }),\n                  }),\n                });\n'
              ),
          ])

          print('Custom provider repair applied.')
    
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/customLlmConfig.ts src/settings/LLMSettings.tsx src/stores/configStore.ts src/components/ServiceStatusBar.tsx
          git diff --cached --quiet && exit 0
          git commit -m "[auto-fix] fix Custom Requesty persistence and picker"
          git push
